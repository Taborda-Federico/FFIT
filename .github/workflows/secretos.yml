name: Secretos

# Escanea cada PR y cada push a main. Existe porque dos veces se commitearon
# cosas que no debían estar en un repo público (el .env y la sesión de
# WhatsApp) — ver docs/CAMBIOS.md #15. Solo mira los commits nuevos: el
# historial viejo ya está comprometido y se resuelve rotando credenciales.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  secretos:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archivos que nunca deben versionarse
        run: |
          prohibidos=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|development|test)$|\.wwebjs_auth/|\.pem$|\.key$|service-?account.*\.json$' || true)
          if [ -n "$prohibidos" ]; then
            echo "::error::Archivos prohibidos versionados (credenciales/sesiones):"
            echo "$prohibidos"
            exit 1
          fi
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
