name: Tests

# Corre en cada PR y en cada push a main. Es la red de seguridad antes de
# mergear cualquier cosa: esta app está en producción y en uso real, así que
# ningún cambio de lógica se mergea sin que estos tres jobs den verde.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: el-gym-back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: el-gym-back/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: el-gym-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: el-gym-front/package-lock.json
      - run: npm ci
      - run: npm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            el-gym-back/package-lock.json
            el-gym-front/package-lock.json
      - name: Instalar dependencias del backend
        working-directory: el-gym-back
        run: npm ci
      - name: Instalar dependencias del frontend
        working-directory: el-gym-front
        run: npm ci
      - name: Instalar navegador de Playwright
        working-directory: el-gym-front
        run: npx playwright install --with-deps chromium
      - name: Correr tests e2e
        working-directory: el-gym-front
        run: npx playwright test
      - name: Subir reporte de Playwright si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: el-gym-front/playwright-report/
          retention-days: 7
